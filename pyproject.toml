[project]
name = "general-monitor"
version = "0.1.0"
description = "Self-hosted, multi-topic analytics monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.2",
    "httpx>=0.28.1",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "shiny>=1.6.1",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv]
package = false
